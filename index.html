<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="pwa-icon.png" />
  <link rel="apple-touch-icon" href="pwa-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#09090b">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, healthy-ui=true" />
  <meta name="description"
    content="Create and share real-time plans with friends and team. Check off together and get things done." />
  <!--
    Canonical address. The app is one single URL: every view (home, plan, profile,
    completed) is internal state, not a route, so there is exactly one canonical.
    The GitHub Pages copy (nrn-world.github.io/DoneTogether/) 301-redirects here, and
    the invite links (/DoneTogether/join/<code>) are served by 404.html — a copy of
    this file — so they consolidate to the same app root instead of being indexed.
    If the domain changes, change this one line (keep the trailing slash).
  -->
  <link rel="canonical" href="https://nrnworld.one/DoneTogether/" />
  <!--
    Structured data (schema.org / JSON-LD). The app is one URL, so one block describes
    the whole page: the organisation behind it (nRn World), the site itself and the
    installable web app. A JSON-LD block is data, not executed script, so it needs no
    CSP allowance — script-src stays without 'unsafe-inline'.
    Keep url, name and description in sync with the canonical link and meta description
    above. 'offers.price 0' means the app is free to use; change the currency or drop
    the offers block if you ever charge for it.
  -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://nrnworld.one/#organization",
          "name": "nRn World",
          "url": "https://nrnworld.one/",
          "sameAs": ["https://github.com/nRn-World/DoneTogether"]
        },
        {
          "@type": "WebSite",
          "@id": "https://nrnworld.one/DoneTogether/#website",
          "url": "https://nrnworld.one/DoneTogether/",
          "name": "DoneTogether",
          "description": "Create and share real-time plans with friends and team. Check off together and get things done.",
          "inLanguage": ["en", "sv", "tr"],
          "publisher": { "@id": "https://nrnworld.one/#organization" }
        },
        {
          "@type": "WebApplication",
          "@id": "https://nrnworld.one/DoneTogether/#app",
          "name": "DoneTogether",
          "url": "https://nrnworld.one/DoneTogether/",
          "description": "Create and share real-time plans with friends and team. Check off together and get things done.",
          "applicationCategory": "ProductivityApplication",
          "operatingSystem": "Web browser, Android",
          "image": "https://nrnworld.one/DoneTogether/pwa-icon.png",
          "inLanguage": ["en", "sv", "tr"],
          "isAccessibleForFree": true,
          "isPartOf": { "@id": "https://nrnworld.one/DoneTogether/#website" },
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "SEK"
          },
          "publisher": { "@id": "https://nrnworld.one/#organization" }
        }
      ]
    }
  </script>
  <title>DoneTogether</title>
  <!--
    Social sharing (Open Graph + Twitter). Chat apps and social crawlers do not run
    JavaScript, so these tags must be in the static HTML — a client-side rewrite would
    never be seen. The app is one URL, so one card describes the whole site; invite
    links (/DoneTogether/join/<code>) are served by 404.html, a copy of this file, and
    therefore get the same preview. og:image is an absolute URL, 940x627 (≥200x200,
    under 8 MB) and gets cropped to ~1.91:1 by the platforms — the middle of the photo
    is what you will see. Point it at a dedicated 1200x630 card if you make one.
  -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="DoneTogether" />
  <meta property="og:title" content="DoneTogether – plan and do things together" />
  <meta property="og:description"
    content="Create and share real-time plans with friends and team. Check off together and get things done." />
  <meta property="og:url" content="https://nrnworld.one/DoneTogether/" />
  <meta property="og:image" content="https://nrnworld.one/DoneTogether/images/team-planning.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="940" />
  <meta property="og:image:height" content="627" />
  <meta property="og:image:alt" content="A team planning together in front of a whiteboard covered in sticky notes" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="sv_SE" />
  <meta property="og:locale:alternate" content="tr_TR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="DoneTogether – plan and do things together" />
  <meta name="twitter:description"
    content="Create and share real-time plans with friends and team. Check off together and get things done." />
  <meta name="twitter:image" content="https://nrnworld.one/DoneTogether/images/team-planning.jpg" />
  <meta name="twitter:image:alt" content="A team planning together in front of a whiteboard covered in sticky notes" />
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCA_1UxB7z86TvyIEpgqnTwnUgqOWTEf_4&libraries=places"></script>
</head>

<body>
  <!--
    The landing content is generated at build time, not authored here: the
    staticLanding() plugin in scripts/static-landing.ts reads src/locales/en.json and
    replaces everything between the two markers below with a real landing section
    (heading, copy and links). GitHub Pages and Firebase Hosting only serve files, so
    without that build step the HTML would reach a crawler empty. React replaces the
    section again when it mounts, which keeps exactly one <h1> in the rendered app.
  -->
  <div id="root">
    <!-- static-landing:start -->
    <h1
      style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;">
      DoneTogether &ndash; create shared plans and get things done together with friends and team
    </h1>
    <!-- static-landing:end -->
  </div>
  <script src="./early-errors.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
